name: Verify MathOS Worker Kernel

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-ci.yml"
  workflow_dispatch:

concurrency:
  group: mathos-worker-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install exact symbolic backend
        working-directory: worker
        run: pip install -r requirements.txt
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Fetch official AlphaGeometry2 symbolic backend
        run: git clone --depth 1 https://github.com/google-deepmind/alphageometry2.git "$RUNNER_TEMP/alphageometry2"
      - name: Install official AlphaGeometry2 runtime dependency
        run: python -m pip install numpy
      - name: Test the authoritative semantic and execution kernel
        working-directory: worker
        env:
          MATHOS_AG2_DIR: ${{ runner.temp }}/alphageometry2
        run: npm test
      - name: Reproduce official DDAR formalized benchmark
        working-directory: worker
        env:
          MATHOS_AG2_DIR: ${{ runner.temp }}/alphageometry2
        run: python backend/alphageometry2_adapter.py --official-suite
      - name: Type-check the production Worker
        working-directory: worker
        run: npm run build

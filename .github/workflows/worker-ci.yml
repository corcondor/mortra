name: Verify MORTRA Kernels

on:
  push:
    branches: [master, codex/q-directed-closure-20260913, codex/theory-formation-20260913]
    paths:
      - "math_os_prototype/**"
      - "scripts/*.py"
      - "configs/q-directed-verification.json"
      - "configs/theory-*.json"
      - "tests/test_theory_formation.py"
      - "tests/test_theory_dsl.py"
      - "tests/test_theory_semantic_edit.py"
      - "tests/test_theory_corpus.py"
      - "tests/test_temporal_utility.py"
      - "tests/test_basis_quality.py"
      - "tests/test_geometry_contracts.py"
      - "docs/handoff/THEORY-FORMATION*.md"
      - "tests/test_q_directed_ci.py"
      - "requirements*.txt"
      - "docs/handoff/Q-DIRECTED*.md"
      - "worker/**"
      - "lib/proof-scene.ts"
      - "lib/mortra/vision/**"
      - "lib/mortra/diagram/**"
      - "lib/mortra/construction/**"
      - "tests/visual-candidate-loop.test.ts"
      - "tests/finite-state-diagram.test.ts"
      - "tests/euclidean-construction.test.ts"
      - "tests/spatial-circle-family.test.ts"
      - "tests/diagrammatic-complex.test.ts"
      - "scripts/visual-reasoning-loop-experiment.mts"
      - "scripts/finite-state-diagram-experiment.mts"
      - "scripts/euclidean-construction-experiment.mts"
      - "data/visual-reasoning-*.json"
      - "data/finite-state-diagram-*.json"
      - "data/euclidean-construction-*.json"
      - "package.json"
      - "scripts/external_backend_invariant.py"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "math_os_prototype/**"
      - "scripts/*.py"
      - "configs/q-directed-verification.json"
      - "configs/theory-*.json"
      - "tests/test_theory_formation.py"
      - "tests/test_theory_dsl.py"
      - "tests/test_theory_semantic_edit.py"
      - "tests/test_theory_corpus.py"
      - "tests/test_temporal_utility.py"
      - "tests/test_basis_quality.py"
      - "tests/test_geometry_contracts.py"
      - "docs/handoff/THEORY-FORMATION*.md"
      - "tests/test_q_directed_ci.py"
      - "requirements*.txt"
      - "docs/handoff/Q-DIRECTED*.md"
      - "worker/**"
      - "lib/proof-scene.ts"
      - "lib/mortra/vision/**"
      - "lib/mortra/diagram/**"
      - "lib/mortra/construction/**"
      - "tests/visual-candidate-loop.test.ts"
      - "tests/finite-state-diagram.test.ts"
      - "tests/euclidean-construction.test.ts"
      - "tests/spatial-circle-family.test.ts"
      - "tests/diagrammatic-complex.test.ts"
      - "scripts/visual-reasoning-loop-experiment.mts"
      - "scripts/finite-state-diagram-experiment.mts"
      - "scripts/euclidean-construction-experiment.mts"
      - "data/visual-reasoning-*.json"
      - "data/finite-state-diagram-*.json"
      - "data/euclidean-construction-*.json"
      - "package.json"
      - "scripts/external_backend_invariant.py"
      - ".github/workflows/worker-ci.yml"
  workflow_dispatch:
    inputs:
      verification_suite:
        description: Worker checks, q-directed reproduction, or target-free theory experiments
        type: choice
        options: [worker, q-directed, theory-formation, geometry, geometry-contracts, geometry-contraction, dsl-feedback, temporal-utility, basis-quality, persistent-learning, frontier-reconnection, capacity-study, bottleneck-study]
        default: worker
      target_ref:
        description: Research commit or branch (empty uses the triggering SHA)
        type: string
        default: ""
      expected_sha:
        description: Optional full expected research SHA; mismatch stops before tests
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    if: >-
      ${{ !(github.ref == 'refs/heads/codex/q-directed-closure-20260913' && github.event_name == 'push')
          && !(github.event_name == 'pull_request' && (github.head_ref == 'codex/q-directed-closure-20260913' || github.base_ref == 'codex/q-directed-closure-20260913'))
          && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/theory-formation-20260913')
          && !(github.event_name == 'pull_request' && (github.head_ref == 'codex/theory-formation-20260913' || github.base_ref == 'codex/theory-formation-20260913'))
          && !(github.event_name == 'workflow_dispatch' && inputs.verification_suite != 'worker') }}
    concurrency:
      group: mortra-worker-kernel-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install exact symbolic backend
        working-directory: worker
        run: pip install -r requirements.txt
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Reject removed external backends
        run: python scripts/external_backend_invariant.py
      - name: Test the authoritative semantic and execution kernel
        working-directory: worker
        run: npm test
      - name: Test semantic geometry feedback loop
        run: npm run test:visual-loop
      - name: Test executable finite-state diagram loop
        run: npm run test:diagram-loop
      - name: Test dynamic Euclidean construction loop
        run: npm run test:construction-loop
      - name: Reproduce semantic geometry experiment artifact
        run: |
          npm run experiment:visual-loop
          git diff --exit-code -- data/visual-reasoning-loop-experiment.json data/visual-reasoning-demo.json
      - name: Execute finite-state diagram A/B experiment
        run: npm run experiment:diagram-loop
      - name: Reproduce dynamic Euclidean construction experiment
        run: |
          npm run experiment:construction-loop
          git diff --exit-code -- data/euclidean-construction-experiment.json data/euclidean-construction-demo.json
      - name: Type-check the production Worker
        working-directory: worker
        run: npm run build

  q-directed-verification:
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/codex/q-directed-closure-20260913')
          || (github.event_name == 'pull_request' && (github.head_ref == 'codex/q-directed-closure-20260913' || github.base_ref == 'codex/q-directed-closure-20260913'))
          || (github.event_name == 'push' && github.ref == 'refs/heads/codex/theory-formation-20260913')
          || (github.event_name == 'pull_request' && (github.head_ref == 'codex/theory-formation-20260913' || github.base_ref == 'codex/theory-formation-20260913'))
          || (github.event_name == 'workflow_dispatch' && inputs.verification_suite != 'worker') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.verification_suite == 'geometry-contraction' && 60 || inputs.verification_suite == 'bottleneck-study' && 180 || (inputs.verification_suite == 'persistent-learning' || inputs.verification_suite == 'frontier-reconnection' || inputs.verification_suite == 'capacity-study') && 120 || (inputs.verification_suite == 'dsl-feedback' || github.ref == 'refs/heads/codex/theory-formation-20260913') && 60 || 20 }}
    concurrency:
      group: mortra-q-directed-${{ github.event_name }}-${{ inputs.target_ref || github.head_ref || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: ""
      TARGET_REF: ${{ inputs.target_ref || github.sha }}
      EXPECTED_SHA: ${{ inputs.expected_sha || (!inputs.target_ref && github.sha) || '' }}
      REPORT_REF: ${{ inputs.target_ref || github.ref }}
      THEORY_MODE: ${{ inputs.verification_suite == 'theory-formation' || inputs.verification_suite == 'persistent-learning' || github.ref == 'refs/heads/codex/theory-formation-20260913' || github.head_ref == 'codex/theory-formation-20260913' || github.base_ref == 'codex/theory-formation-20260913' }}
      LONG_MODE: ${{ inputs.verification_suite == 'persistent-learning' || inputs.verification_suite == 'frontier-reconnection' || inputs.verification_suite == 'capacity-study' || inputs.verification_suite == 'bottleneck-study' }}
      FRONTIER_MODE: ${{ inputs.verification_suite == 'frontier-reconnection' }}
      CAPACITY_MODE: ${{ inputs.verification_suite == 'capacity-study' }}
      BOTTLENECK_MODE: ${{ inputs.verification_suite == 'bottleneck-study' }}
      DSL_MODE: ${{ inputs.verification_suite == 'dsl-feedback' }}
      TEMPORAL_MODE: ${{ inputs.verification_suite == 'temporal-utility' }}
      BASIS_MODE: ${{ inputs.verification_suite == 'basis-quality' }}
      GEOMETRY_MODE: ${{ inputs.verification_suite == 'geometry' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/theory-formation-20260913') }}
      CONTRACT_MODE: ${{ inputs.verification_suite == 'geometry-contracts' }}
      CONTRACTION_MODE: ${{ inputs.verification_suite == 'geometry-contraction' }}
      PYTHONHASHSEED: "0"
    steps:
      - name: Set output location
        shell: bash
        run: echo "VERIFY_OUTPUT=$RUNNER_TEMP/q-directed-verification" >> "$GITHUB_ENV"
      - name: Check out the verification harness at the workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-control
          persist-credentials: false
      - name: Check out the research target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            ci-control/requirements.txt
            ci-control/requirements-test.txt
      - name: Check out the original mathematical baseline for paired comparison
        if: env.FRONTIER_MODE == 'true'
        uses: actions/checkout@v4
        with:
          ref: f9f80e39ca92035bfc37490ad5a072289c9cd80f
          path: baseline
          persist-credentials: false
      - name: Freeze exact target, commands, and initial verification record
        shell: bash
        run: |
          python ci-control/scripts/verify_q_directed_ci.py --prepare \
            --repo target --output "$VERIFY_OUTPUT" \
            --repository "$GITHUB_REPOSITORY" --ref "$REPORT_REF" \
            --expected-sha "$EXPECTED_SHA"
          cat "$VERIFY_OUTPUT/git-sha.txt"
          cat "$VERIFY_OUTPUT/plan.json"
      - name: Install formally declared verification dependencies
        shell: bash
        run: |
          python -m pip install -r ci-control/requirements-test.txt 2>&1 | tee "$VERIFY_OUTPUT/dependency-install.log"
          python -m pip check 2>&1 | tee "$VERIFY_OUTPUT/dependency-check.log"
      - name: Test verification gates
        run: python -m unittest discover -s ci-control/tests -p test_q_directed_ci.py -v
      - name: Install pinned geometry adapter dependencies
        if: env.GEOMETRY_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python -m pip install -r requirements-geometry.txt 2>&1 | tee "$VERIFY_OUTPUT/geometry-dependencies.log"
          python -m pip freeze > "$VERIFY_OUTPUT/geometry-environment.txt"
      - name: Test shared planner and geometry adapter boundaries
        if: env.GEOMETRY_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python -m pytest tests/test_theory_geometry.py tests/test_theory_dsl.py -q \
            2>&1 | tee "$VERIFY_OUTPUT/geometry-tests.log"
      - name: Reproduce frozen formal geometry cohort through the normal Theory entry
        if: env.GEOMETRY_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python scripts/verify_theory_geometry.py --plan configs/theory-geometry-cohort.json \
            --output "$VERIFY_OUTPUT/geometry" 2>&1 | tee "$VERIFY_OUTPUT/geometry-run.log"
      - name: Reproduce tests, acquisition, stored reuse, and refusal
        shell: bash
        run: |
          python ci-control/scripts/verify_q_directed_ci.py --execute \
            --repo target --output "$VERIFY_OUTPUT"
      - name: Install the declared rational contract fragment dependencies
        if: env.CONTRACT_MODE == 'true' || env.CONTRACTION_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python -m pip install -r requirements-geometry-contracts.txt 2>&1 | tee "$VERIFY_OUTPUT/contract-dependencies.log"
          python -m pip freeze > "$VERIFY_OUTPUT/contract-environment.txt"
      - name: Test and reproduce acquired geometry contracts with causal ablation
        if: env.CONTRACT_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python -m pytest tests/test_geometry_contracts.py tests/test_theory_geometry.py tests/test_theory_dsl.py \
            tests/test_theory_formation.py worker/backend/test_typed_geometry_stalk.py -q \
            --junitxml="$VERIFY_OUTPUT/contract-tests.xml" 2>&1 | tee "$VERIFY_OUTPUT/contract-tests.log"
          python scripts/run_theory_formation.py --config configs/theory-geometry-contract-acquisition.json \
            --output "$VERIFY_OUTPUT/geometry-contracts" 2>&1 | tee "$VERIFY_OUTPUT/contract-run.log"
          python scripts/replay_geometry_contracts.py --run "$VERIFY_OUTPUT/geometry-contracts" \
            --output "$VERIFY_OUTPUT/contract-replay.json" --require-chain 2>&1 | tee "$VERIFY_OUTPUT/contract-replay.log"
      - name: Test certified morphism contraction and frozen fresh cohort
        if: env.CONTRACTION_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python -m pytest tests/test_geometry_contracts.py tests/test_geometry_contraction.py \
            tests/test_theory_geometry.py tests/test_theory_dsl.py tests/test_theory_formation.py \
            worker/backend/test_typed_geometry_stalk.py -q \
            --junitxml="$VERIFY_OUTPUT/contraction-tests.xml" 2>&1 | tee "$VERIFY_OUTPUT/contraction-tests.log"
          python scripts/run_theory_formation.py --config configs/theory-geometry-morphism-contraction.json \
            --output "$VERIFY_OUTPUT/geometry-contraction" 2>&1 | tee "$VERIFY_OUTPUT/contraction-run.log"
          python scripts/replay_geometry_contraction.py --run "$VERIFY_OUTPUT/geometry-contraction" \
            --output "$VERIFY_OUTPUT/contraction-replay.json" --require-scientific-pass \
            2>&1 | tee "$VERIFY_OUTPUT/contraction-replay.log"
      - name: Test theory formation guards
        if: env.THEORY_MODE == 'true'
        working-directory: target
        shell: bash
        run: python -m unittest discover -s tests -p test_theory_formation.py -v 2>&1 | tee "$VERIFY_OUTPUT/theory-tests.log"
      - name: Run frozen target-free experiments and ablations
        if: env.THEORY_MODE == 'true' && env.LONG_MODE != 'true' && env.GEOMETRY_MODE != 'true' && env.CONTRACT_MODE != 'true'
        working-directory: target
        shell: bash
        run: |
          args=(--config configs/theory-ring.json --config configs/theory-fold-frames.json)
          if [ -f configs/theory-heldout.json ]; then
            args+=(--config configs/theory-heldout.json)
          fi
          python scripts/verify_theory_formation.py --output "$VERIFY_OUTPUT/theory" "${args[@]}" 2>&1 | tee "$VERIFY_OUTPUT/theory-run.log"
      - name: Test longitudinal measurement isolation
        if: env.LONG_MODE == 'true'
        working-directory: ci-control
        shell: bash
        run: python -m unittest discover -s tests -p test_persistent_learning_measurement.py -v 2>&1 | tee "$VERIFY_OUTPUT/measurement-tests.log"
      - name: Test executable DSL and exact space-sharing guards
        if: env.DSL_MODE == 'true' || env.TEMPORAL_MODE == 'true' || env.BASIS_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python -m pytest tests/test_theory_dsl.py tests/test_theory_semantic_edit.py tests/test_theory_corpus.py tests/test_temporal_utility.py tests/test_basis_quality.py scripts/test_library_compression.py \
            scripts/test_expand_for_execution.py scripts/test_call_candidate_dedup.py -q \
            2>&1 | tee "$VERIFY_OUTPUT/dsl-tests.log"
      - name: Measure causal future utility on the shared normal stream
        if: env.TEMPORAL_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python scripts/verify_temporal_utility.py --plan configs/theory-temporal-utility.json \
            --output "$VERIFY_OUTPUT/temporal-utility" \
            2>&1 | tee "$VERIFY_OUTPUT/temporal-utility.log"
      - name: Measure primitive basis deletion, reconstruction and learned additions
        if: env.BASIS_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python scripts/verify_basis_quality.py --plan configs/theory-basis-quality.json \
            --output "$VERIFY_OUTPUT/basis-quality" \
            2>&1 | tee "$VERIFY_OUTPUT/basis-quality.log"
      - name: Run persistent DSL acquisition, reuse and held-out ablation
        if: env.DSL_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python scripts/verify_theory_dsl.py --config configs/theory-dsl-ring.json \
            --config configs/theory-dsl-fold.json --output "$VERIFY_OUTPUT/dsl-feedback" \
            2>&1 | tee "$VERIFY_OUTPUT/dsl-feedback.log"
      - name: Synthesize unseen finite observations from frozen value specifications
        if: env.DSL_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          for seed in 917334 917335; do
            python scripts/verify_theory_tasks.py --config configs/theory-dsl-fold.json \
              --challenge-seed "$seed" --output "$VERIFY_OUTPUT/dsl-tasks-$seed" \
              2>&1 | tee "$VERIFY_OUTPUT/dsl-tasks-$seed.log"
          done
      - name: Verify eligible abstraction sources and frozen generalization
        if: env.DSL_MODE == 'true'
        working-directory: target
        shell: bash
        run: |
          python scripts/verify_theory_semantic_edit.py --plan configs/theory-eligible-sources-evaluation.json \
            --output "$VERIFY_OUTPUT/dsl-eligible-sources" \
            2>&1 | tee "$VERIFY_OUTPUT/dsl-eligible-sources.log"
      - name: Measure frozen-baseline persistent learning
        if: env.LONG_MODE == 'true' && env.FRONTIER_MODE != 'true' && env.CAPACITY_MODE != 'true' && env.BOTTLENECK_MODE != 'true'
        shell: bash
        run: |
          export MORTRA_BASELINE_ROOT="$GITHUB_WORKSPACE/target"
          python ci-control/scripts/measure_persistent_learning.py \
            --plan ci-control/configs/persistent-learning.json \
            --output "$VERIFY_OUTPUT/persistent-learning" 2>&1 | tee "$VERIFY_OUTPUT/persistent-learning.log"
      - name: Test frontier and resource-bound measurement guards
        if: env.FRONTIER_MODE == 'true'
        working-directory: ci-control
        shell: bash
        run: |
          python -m pytest tests/test_frontier_reconnection.py tests/test_persistent_learning_state_audit.py -q 2>&1 | tee "$VERIFY_OUTPUT/frontier-tests.log"
      - name: Run the frozen before-after frontier experiment
        if: env.FRONTIER_MODE == 'true'
        shell: bash
        run: |
          python ci-control/scripts/measure_frontier_reconnection.py \
            --before "$GITHUB_WORKSPACE/baseline" --after "$GITHUB_WORKSPACE/target" \
            --expected-after "$EXPECTED_SHA" --output "$VERIFY_OUTPUT/frontier-reconnection" \
            2>&1 | tee "$VERIFY_OUTPUT/frontier-reconnection.log"
      - name: Test capacity measurement and freeze both conditions
        if: env.CAPACITY_MODE == 'true'
        working-directory: ci-control
        shell: bash
        run: |
          python -m pytest tests/test_capacity_study.py -q 2>&1 | tee "$VERIFY_OUTPUT/capacity-tests.log"
          export MORTRA_BASELINE_ROOT="$GITHUB_WORKSPACE/target"
          python scripts/analyze_capacity_study.py --prepare --output "$VERIFY_OUTPUT/capacity-study"
      - name: Execute unchanged mathematics at both frozen archive capacities
        if: env.CAPACITY_MODE == 'true'
        shell: bash
        run: |
          export MORTRA_BASELINE_ROOT="$GITHUB_WORKSPACE/target"
          for capacity in 128 256; do
            started=$SECONDS
            python ci-control/scripts/measure_persistent_learning.py \
              --plan "ci-control/configs/persistent-learning-capacity-$capacity.json" \
              --output "$VERIFY_OUTPUT/capacity-study/$capacity" \
              2>&1 | tee "$VERIFY_OUTPUT/capacity-$capacity.log"
            printf '{"wall_seconds": %s, "resolution_seconds": 1}\n' "$((SECONDS-started))" > "$VERIFY_OUTPUT/capacity-study/$capacity/wall-clock.json"
          done
      - name: Measure concept ancestry and disable additional acquisitions
        if: env.CAPACITY_MODE == 'true'
        shell: bash
        run: |
          export MORTRA_BASELINE_ROOT="$GITHUB_WORKSPACE/target"
          python ci-control/scripts/analyze_capacity_study.py --output "$VERIFY_OUTPUT/capacity-study" 2>&1 | tee "$VERIFY_OUTPUT/capacity-analysis.log"
      - name: Test read-only bottleneck observers
        if: env.BOTTLENECK_MODE == 'true'
        working-directory: ci-control
        shell: bash
        run: python -m pytest tests/test_theory_bottleneck.py -q 2>&1 | tee "$VERIFY_OUTPUT/bottleneck-tests.log"
      - name: Trace size rejection then run frozen single-factor bottleneck study
        if: env.BOTTLENECK_MODE == 'true'
        shell: bash
        run: |
          export MORTRA_BASELINE_ROOT="$GITHUB_WORKSPACE/target"
          python ci-control/scripts/measure_theory_bottleneck.py \
            --plan ci-control/configs/theory-bottleneck-study.json \
            --output "$VERIFY_OUTPUT/bottleneck-study" 2>&1 | tee "$VERIFY_OUTPUT/bottleneck-study.log"
      - name: Publish persistent learning report
        if: always() && env.LONG_MODE == 'true'
        shell: bash
        run: |
          if [ -f "$VERIFY_OUTPUT/persistent-learning/report.md" ]; then
            cat "$VERIFY_OUTPUT/persistent-learning/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish machine-readable summary
        if: always()
        shell: bash
        run: |
          if [ -f "$VERIFY_OUTPUT/theory/verification.json" ]; then
            echo '### Target-free theory formation' >> "$GITHUB_STEP_SUMMARY"
            python - "$VERIFY_OUTPUT/theory/verification.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          print("Infrastructure passed:", s["infrastructure_passed"])
          print("Scientific criteria all met:", s["all_scientific_criteria_met"])
          for name, row in s["experiments"].items():
              print(name, row["comparative_criteria"])
          print("Full outputs, paired costs and failed conditions are in the artifact.")
          PY
          fi
      - name: Publish q-directed summary
        if: always()
        shell: bash
        run: |
          if [ -f "$VERIFY_OUTPUT/verification.json" ]; then
            echo '### Q-directed reproduction' >> "$GITHUB_STEP_SUMMARY"
            echo 'The target SHA and harness SHA are recorded separately.' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat "$VERIFY_OUTPUT/verification.json" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload fresh verification evidence, including failures
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q-directed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/q-directed-verification/
          if-no-files-found: error
          retention-days: 30

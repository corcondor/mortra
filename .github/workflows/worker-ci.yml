name: Verify MORTRA Worker Kernel

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - "scripts/external_backend_invariant.py"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "worker/**"
      - "scripts/external_backend_invariant.py"
      - ".github/workflows/worker-ci.yml"
  workflow_dispatch:

concurrency:
  group: mortra-worker-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install exact symbolic backend
        working-directory: worker
        run: pip install -r requirements.txt
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Reject removed external backends
        run: python scripts/external_backend_invariant.py
      - name: Test the authoritative semantic and execution kernel
        working-directory: worker
        run: npm test
      - name: Type-check the production Worker
        working-directory: worker
        run: npm run build

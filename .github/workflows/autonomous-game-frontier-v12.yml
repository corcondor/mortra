name: Frontier v1.2 Adaptive Designer
on:
  push:
    branches: [research/autonomous-game-frontier-v12-adaptive-designer-20260925]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontier-v12-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  MPLBACKEND: Agg
jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 matplotlib==3.10.5 psutil==7.0.0 pytest==8.4.1
      - run: python -m pytest tests/test_autonomous_game_frontier_v1.py tests/test_autonomous_game_frontier_v11.py tests/test_autonomous_game_frontier_v11_holdout.py tests/test_autonomous_game_frontier_v11_generation_holdout.py tests/test_autonomous_game_frontier_v11_replication.py tests/test_autonomous_game_frontier_v12.py -q --junitxml=correctness.xml
      - run: python scripts/evaluate_autonomous_game_frontier_v12.py register --output reports/frontier_v12/registration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-registration
          path: |
            correctness.xml
            reports/frontier_v12/registration/
          retention-days: 90
  stage1:
    needs: stage0
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [3101, 3202, 3303]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 matplotlib==3.10.5 psutil==7.0.0 pytest==8.4.1
      - run: python scripts/evaluate_autonomous_game_frontier_v12.py evolve --stage 1 --seed ${{ matrix.seed }} --output reports/frontier_v12/stage1/${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-stage1-${{ matrix.seed }}
          path: reports/frontier_v12/stage1/${{ matrix.seed }}/
          retention-days: 90
  stage1-check:
    needs: stage1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 matplotlib==3.10.5 psutil==7.0.0 pytest==8.4.1
      - uses: actions/download-artifact@v4
        with:
          pattern: v12-stage1-*
          path: smoke
      - run: python scripts/evaluate_autonomous_game_frontier_v12.py smoke-check --input smoke --output reports/frontier_v12/smoke-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-smoke-check
          path: reports/frontier_v12/smoke-check/
          retention-days: 90
  evolution:
    needs: stage1-check
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [2101, 2202, 2303, 2404, 2505, 2606, 2707, 2808]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 matplotlib==3.10.5 psutil==7.0.0 pytest==8.4.1
      - run: python scripts/evaluate_autonomous_game_frontier_v12.py evolve --stage 2 --seed ${{ matrix.seed }} --output reports/frontier_v12/evolution/${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-evolution-${{ matrix.seed }}
          path: reports/frontier_v12/evolution/${{ matrix.seed }}/
          retention-days: 90
  freeze:
    needs: evolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 matplotlib==3.10.5 psutil==7.0.0 pytest==8.4.1
      - uses: actions/download-artifact@v4
        with:
          pattern: v12-evolution-*
          path: evolution
      - run: python scripts/evaluate_autonomous_game_frontier_v12.py freeze --input evolution --output reports/frontier_v12/frozen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-frozen
          path: reports/frontier_v12/frozen/
          retention-days: 90
  holdout:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [2101, 2202, 2303, 2404, 2505, 2606, 2707, 2808]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 matplotlib==3.10.5 psutil==7.0.0 pytest==8.4.1
      - uses: actions/download-artifact@v4
        with:
          name: v12-frozen
          path: frozen
      - run: python scripts/evaluate_autonomous_game_frontier_v12.py audit --frozen frozen --seed ${{ matrix.seed }} --output reports/frontier_v12/holdout/${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-holdout-${{ matrix.seed }}
          path: reports/frontier_v12/holdout/${{ matrix.seed }}/
          retention-days: 90
  summary:
    needs: holdout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 matplotlib==3.10.5 psutil==7.0.0 pytest==8.4.1
      - uses: actions/download-artifact@v4
        with:
          name: v12-frozen
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: v12-holdout-*
          path: holdout
      - uses: actions/download-artifact@v4
        with:
          pattern: v12-evolution-*
          path: evolution
      - run: python scripts/evaluate_autonomous_game_frontier_v12.py summarize --input holdout --frozen frozen --evolution evolution --output reports/frontier_v12/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-summary
          path: reports/frontier_v12/summary/
          retention-days: 90

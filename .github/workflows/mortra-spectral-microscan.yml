name: MORTRA spectral micro-scan audit

on:
  push:
    branches: ['research/mortra-forward-integration-20260929']
    paths:
      - 'experiments/spectral_microscan_audit/**'
      - '.github/workflows/mortra-spectral-microscan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0
      - name: Development protocol
        run: python -m experiments.spectral_microscan_audit.run --output spectral-microscan-dev --seed-start 99029000 --worlds 16
      - name: Fresh confirmation, unchanged protocol
        run: python -m experiments.spectral_microscan_audit.run --output spectral-microscan-confirm --seed-start 99129000 --worlds 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-microscan-${{ github.run_id }}
          path: |
            spectral-microscan-dev
            spectral-microscan-confirm
          retention-days: 30

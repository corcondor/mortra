name: Noisy RGB suffix discovery development
on:
  push:
    branches: [research/noisy-rgb-suffix-discovery-20260927]
    paths:
      - experiments/noisy_rgb_discovery/**
      - tests/test_noisy_rgb_discovery.py
      - .github/workflows/noisy-rgb-discovery.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noisy-rgb-discovery-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/noisy_rgb_discovery
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0 pytest==8.4.1 psutil==7.0.0
      - run: python -m pytest tests/test_noisy_rgb_discovery.py -q --junitxml=tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noisy-rgb-tests-${{ github.run_id }}
          path: tests.xml
          retention-days: 90
  experiment:
    needs: tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [95027004, 95027005]
        camera: [base, shifted]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: experiments/noisy_rgb_discovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0 psutil==7.0.0
      - run: python -m experiments.noisy_rgb_discovery.run --seed ${{ matrix.seed }} --camera ${{ matrix.camera }} --output reports/noisy_rgb_${{ matrix.seed }}_${{ matrix.camera }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noisy-rgb-${{ matrix.seed }}-${{ matrix.camera }}-${{ github.run_id }}
          path: reports/
          retention-days: 90

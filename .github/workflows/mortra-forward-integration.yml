name: MORTRA forward integration

on:
  push:
    branches: ['research/mortra-forward-integration-20260929']
    paths:
      - 'experiments/noisy_rgb_discovery/**'
      - 'experiments/noisy_rgb_version_space/**'
      - 'experiments/noisy_rgb_predictive_signature/**'
      - 'experiments/continual_tools/**'
      - 'tests/test_noisy_rgb_discovery.py'
      - 'tests/test_noisy_rgb_version_space.py'
      - 'tests/test_noisy_rgb_predictive_signature.py'
      - 'tests/test_continual_tools.py'
      - '.github/workflows/mortra-forward-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUTF8: '1'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0 pytest==8.4.1 scipy psutil==7.0.0
      - run: >
          python -m pytest -q
          tests/test_noisy_rgb_discovery.py
          tests/test_noisy_rgb_version_space.py
          tests/test_noisy_rgb_predictive_signature.py
          tests/test_continual_tools.py
          --junitxml=forward-integration-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forward-integration-tests-${{ github.run_id }}
          path: forward-integration-tests.xml
          retention-days: 30

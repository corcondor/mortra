name: Noisy RGB depth-2 ceiling and provisional redundancy audit
on:
  workflow_dispatch:
  push:
    branches: ['research/noisy-rgb-depth2-audit-*']
    paths: ['experiments/noisy_rgb_v2_redundancy_audit/launch.json']
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0 pytest==8.4.1
      - run: python -m pytest tests/test_noisy_rgb_depth2_audit.py -q --junitxml=gate/tests.xml
      - run: python -m experiments.noisy_rgb_v2_redundancy_audit.gate --output gate/source
      - id: plan
        shell: pwsh
        run: |
          $matrix = Get-Content gate/source/matrix.json -Raw | ConvertFrom-Json
          $remaining = @($matrix.include | Where-Object { -not ($_.seed -eq 97027000 -and $_.camera -eq 'base') })
          $json = @{include=$remaining} | ConvertTo-Json -Compress -Depth 6
          "matrix=$json" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth2-audit-gate-${{ github.run_id }}
          path: gate
          retention-days: 90
  first:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0
      - run: python -m experiments.noisy_rgb_v2_redundancy_audit.artifacts --seed 97027000 --camera base --output saved
      - run: python -m experiments.noisy_rgb_v2_redundancy_audit.run --input saved --output audit/97027000_base
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth2-audit-compact-97027000-base-${{ github.run_id }}
          path: |
            audit/97027000_base/summary.json
            audit/97027000_base/depth_ceiling.json
            audit/97027000_base/audit_source.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth2-audit-full-97027000-base-${{ github.run_id }}
          path: |
            audit
            saved/download_manifest.json
          retention-days: 90
  diagnose:
    needs: [gate,first]
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0
      - run: python -m experiments.noisy_rgb_v2_redundancy_audit.artifacts --seed ${{ matrix.seed }} --camera ${{ matrix.camera }} --output saved
      - run: python -m experiments.noisy_rgb_v2_redundancy_audit.run --input saved --output audit/${{ matrix.seed }}_${{ matrix.camera }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth2-audit-compact-${{ matrix.seed }}-${{ matrix.camera }}-${{ github.run_id }}
          path: |
            audit/${{ matrix.seed }}_${{ matrix.camera }}/summary.json
            audit/${{ matrix.seed }}_${{ matrix.camera }}/depth_ceiling.json
            audit/${{ matrix.seed }}_${{ matrix.camera }}/audit_source.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth2-audit-full-${{ matrix.seed }}-${{ matrix.camera }}-${{ github.run_id }}
          path: |
            audit
            saved/download_manifest.json
          retention-days: 90
  aggregate:
    needs: [gate,first,diagnose]
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 matplotlib==3.9.4
      - uses: actions/download-artifact@v4
        with:
          pattern: depth2-audit-compact-*
          path: audits
      - uses: actions/download-artifact@v4
        with:
          repository: corcondor/mortra
          run-id: '36309862254'
          github-token: ${{ github.token }}
          name: pv2-summary-36309862254
          path: original_summary
      - run: python -m experiments.noisy_rgb_v2_redundancy_audit.aggregate --input audits --output summary --development-summary original_summary/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth2-audit-summary-${{ github.run_id }}
          path: summary
          retention-days: 90

name: Mario revisit causal probe

on:
  push:
    branches:
      - research/mario-revisit-causal-20260930
    paths:
      - experiments/mario_continual/revisit_causal_probe.py
      - .github/workflows/mario-revisit-causal.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install -q numpy scipy Pillow psutil
      - name: Build pinned Mario engine
        run: python -m experiments.mario_continual.setup_game
      - name: Run causal revisit probe
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            python -u -m experiments.mario_continual.revisit_causal_probe
      - name: Show result
        if: always()
        run: cat /tmp/revisit_causal_result.json || true

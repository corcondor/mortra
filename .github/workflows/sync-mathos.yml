name: Sync MathOS pool to Supabase

# PC を開いていなくても、配信プールが Supabase に載り続けるようにする。
# このリポジトリには既に Supabase の鍵が入っているので、新しい設定は要らない。
#
# バンドル data/mathos/continuous_verified_problem_batch1.json は
# MathOS の受験用プールそのもの。ここから problems テーブルへ upsert する。
on:
  schedule:
    # MathOS の生成が3時間ごとなので、その直後に流し込む
    - cron: "20 */3 * * *"
  push:
    branches: [master]
    paths:
      - "data/mathos/**"
  workflow_dispatch:

concurrency:
  group: mathos-supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts || npm install --ignore-scripts

      - name: Upsert the pool into Supabase
        env:
          # スクリプトが読む名前へ、既存のシークレットを割り当てる
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-mathos-discord.mjs

      - name: Export repair-oriented selection feedback
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/export-selection-feedback.mjs

      - name: Cluster unsupported fusion structures
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/export-fusion-gaps.mjs

      - name: Upload selection feedback report
        uses: actions/upload-artifact@v4
        with:
          name: mathos-selection-feedback
          path: |
            data/mathos/selection-feedback.json
            docs/selection-feedback.md
            data/mathos/fusion-gaps.json
            docs/fusion-gaps.md

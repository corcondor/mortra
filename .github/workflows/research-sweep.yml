name: Resume MathOS Research

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: mathos-autonomous-research
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package.json
      - name: Install worker dependencies
        working-directory: worker
        run: npm install
      - name: Verify structural search
        working-directory: worker
        run: npm test && npm run build
      - name: Resume up to five due research frontiers
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_MAX_TOKENS: ${{ secrets.DEEPSEEK_MAX_TOKENS }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_MODELS_MODEL: openai/gpt-4.1
        run: npx tsx src/research-sweep.ts

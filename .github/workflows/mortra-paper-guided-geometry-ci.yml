      - "scripts/run_algebraic_structures_eval.py"
      - "configs/algebraic-structures-*.json"
      - "math_os_prototype/geometry_relational_*.py"
      - "tests/test_geometry_relational_*.py"
      - "scripts/run_relational_geometry_eval.py"
      - "configs/theory-geometry-relational-dsl-*.json"
      - "vendor/**"
      - "requirements-geometry*.txt"
      - "scripts/verify_vendored_newclid.py"
      - "tests/test_vendored_newclid.py"
      - "math_os_prototype/geometry_symbolic_dsl.py"
      - "math_os_prototype/geometry_proof_dsl.py"
      - "math_os_prototype/theory_geometry.py"
      - "tests/test_geometry_symbolic_dsl.py"
      - "tests/test_geometry_affine_definition.py"
      - "tests/test_geometry_closure_contract.py"
      - "tests/test_geometry_source_scope.py"
      - "worker/backend/jgex_exact_constraint_bridge.py"
      - "scripts/verify_geometry_symbolic_dsl.py"
      - "scripts/verify_theory_geometry.py"
      - "configs/theory-geometry-autonomous-solve.json"
      - "configs/theory-geometry-symbolic-dsl*.json"
      - "math_os_prototype/geometry_semantic_dsl.py"
      - "math_os_prototype/theory_geometry_feedback.py"
      - "math_os_prototype/theory_geometry_selection.py"
      - "math_os_prototype/geometry_execution_audit.py"
      - "worker/backend/typed_geometry_stalk.py"
      - "tests/test_geometry_complete_enumeration.py"
      - "configs/theory-geometry-complete-revalidation.json"
      - "math_os_prototype/runtime_typed_planner.py"
      - "math_os_prototype/test_runtime_typed_planner.py"
      - "tests/test_geometry_selection.py"
      - "configs/theory-geometry-selection-factorial.json"
      - "math_os_prototype/geometry_contracts.py"
      - "math_os_prototype/theory_action_domain.py"
      - "scripts/run_theory_formation.py"
      - "tests/test_geometry_semantic_feedback.py"
      - "configs/theory-geometry-semantic-feedback.json"
      - "configs/theory-geometry-semantic-feedback-eight-cycles.json"
      - "worker/backend/numerical_incidence_auxiliary.py"
      - "worker/backend/typed_bidirectional_priority.py"
      - "worker/backend/constructible_groebner.py"
      - "worker/backend/wu_zero_decomposition.py"
      - "worker/backend/test_numerical_incidence_auxiliary.py"
      - "worker/backend/test_typed_bidirectional_priority.py"
      - "worker/backend/test_constructible_groebner.py"
      - "worker/backend/test_wu_zero_decomposition.py"
      - "worker/backend/test_typed_candidate_alignment.py"
      - "worker/backend/test_typed_open_proof_dag.py"
      - "scripts/experiment_newclid_construction_stalk.py"
      - "scripts/experiment_hageo_incidence_ablation.py"
      - "scripts/export_hageo409_jgex.py"
      - "scripts/audit_hageo409_compatibility.py"
      - "scripts/benchmark_hageo409_native.py"
      - "scripts/benchmark_hageo409_auxiliary.py"
      - "scripts/experiment_wu_zero_decomposition.py"
      - "scripts/finalize_geometry_proof_portfolio.py"
      - "tests/test_export_hageo409_jgex.py"
      - "tests/test_finalize_geometry_proof_portfolio.py"
      - ".github/workflows/mortra-paper-guided-geometry-ci.yml"
  pull_request:
    paths:
      - "math_os_prototype/algebraic_*.py"
      - "tests/test_algebraic_structures.py"
      - "scripts/run_algebraic_structures_eval.py"
      - "configs/algebraic-structures-*.json"
      - "math_os_prototype/geometry_relational_*.py"
      - "tests/test_geometry_relational_*.py"
      - "scripts/run_relational_geometry_eval.py"
      - "configs/theory-geometry-relational-dsl-*.json"
      - "vendor/**"
      - "requirements-geometry*.txt"
      - "scripts/verify_vendored_newclid.py"
      - "tests/test_vendored_newclid.py"
      - "math_os_prototype/geometry_symbolic_dsl.py"
      - "math_os_prototype/geometry_proof_dsl.py"
      - "math_os_prototype/theory_geometry.py"
      - "tests/test_geometry_symbolic_dsl.py"
      - "tests/test_geometry_affine_definition.py"
      - "tests/test_geometry_closure_contract.py"
      - "tests/test_geometry_source_scope.py"
      - "scripts/verify_geometry_symbolic_dsl.py"
      - "scripts/verify_theory_geometry.py"
      - "configs/theory-geometry-autonomous-solve.json"
      - "configs/theory-geometry-symbolic-dsl*.json"
      - "math_os_prototype/theory_geometry_selection.py"
      - "math_os_prototype/geometry_execution_audit.py"
      - "tests/test_geometry_complete_enumeration.py"
      - "configs/theory-geometry-complete-revalidation.json"
      - "math_os_prototype/runtime_typed_planner.py"
      - "math_os_prototype/test_runtime_typed_planner.py"
      - "tests/test_geometry_selection.py"
      - "configs/theory-geometry-selection-factorial.json"
      - "math_os_prototype/geometry_semantic_dsl.py"
      - "math_os_prototype/theory_geometry_feedback.py"
      - "tests/test_geometry_semantic_feedback.py"
      - "configs/theory-geometry-semantic-feedback.json"
      - "configs/theory-geometry-semantic-feedback-eight-cycles.json"
      - "worker/backend/**"
      - "scripts/export_hageo409_jgex.py"
      - "scripts/finalize_geometry_proof_portfolio.py"
      - "tests/test_export_hageo409_jgex.py"
      - "tests/test_finalize_geometry_proof_portfolio.py"
      - ".github/workflows/mortra-paper-guided-geometry-ci.yml"
  workflow_dispatch:
    inputs:
      experiment_config:
        description: Frozen semantic geometry comparison
        type: choice
        default: configs/theory-geometry-complete-revalidation.json
        options:
          - configs/theory-geometry-complete-revalidation.json
          - configs/theory-geometry-selection-factorial.json
          - configs/theory-geometry-semantic-feedback.json
          - configs/theory-geometry-semantic-feedback-eight-cycles.json
          - configs/theory-geometry-failure-location.json
          - configs/theory-geometry-symbolic-dsl.json
          - configs/theory-geometry-symbolic-dsl-integration.json
          - configs/theory-geometry-autonomous-solve.json
          - configs/theory-geometry-autonomous-solve-no-closure.json
          - configs/theory-geometry-autonomous-solve-worker-reuse.json
          - configs/theory-geometry-autonomous-solve-24-20260916.json
          - configs/theory-geometry-autonomous-solve-extended-20260916.json
          - configs/theory-geometry-autonomous-solve-1024-20260916.json
          - configs/theory-geometry-relational-dsl-20260917.json
          - configs/algebraic-structures-20260917.json

permissions:
  contents: read

jobs:
  semantic-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.experiment_config == 'configs/theory-geometry-relational-dsl-20260917.json' && 300 || inputs.experiment_config == 'configs/algebraic-structures-20260917.json' && 150 || inputs.experiment_config == 'configs/theory-geometry-autonomous-solve-1024-20260916.json' && 90 || 60 }}
    env:
      PYTHONHASHSEED: "0"
      EXPERIMENT_CONFIG: ${{ inputs.experiment_config || 'configs/theory-geometry-complete-revalidation.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-geometry-contracts.txt
            vendor/newclid/pyproject.toml
            vendor/newclid.upstream.json
      - name: Install declared exact geometry dependencies
        run: python -m pip install -r requirements-geometry-contracts.txt
      - name: Verify vendored bytes and actual installation origin before tests
        run: python scripts/verify_vendored_newclid.py --output reports/newclid-before.json
      - name: Verify contracts, feedback and existing library regressions
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest -q tests/test_vendored_newclid.py tests/test_geometry_source_scope.py tests/test_geometry_affine_definition.py tests/test_geometry_closure_contract.py tests/test_geometry_symbolic_dsl.py tests/test_geometry_complete_enumeration.py tests/test_geometry_selection.py math_os_prototype/test_runtime_typed_planner.py tests/test_geometry_semantic_feedback.py tests/test_geometry_contracts.py tests/test_geometry_contraction.py tests/test_theory_geometry.py tests/test_geometry_relational_dsl.py tests/test_geometry_relational_edit.py tests/test_algebraic_structures.py scripts/test_library_compression.py worker/backend/test_typed_geometry_stalk.py --junitxml=reports/semantic-feedback-tests.xml | tee reports/semantic-feedback-tests.log
      - name: Verify unchanged upstream parsing and state tests
        shell: bash
        run: |
          python -m pytest -q --import-mode=importlib -p no:cacheprovider vendor/newclid/tests/test_problem.py vendor/newclid/tests/test_jgex_builds.py vendor/newclid/tests/test_permutation_generator.py --junitxml=reports/newclid-upstream-tests.xml | tee reports/newclid-upstream-tests.log
      - name: Verify source scope and existing bridge regressions
        shell: bash
        run: |
          python -m pytest -q worker/backend/test_jgex_exact_constraint_bridge.py -k 'two_locus or line_circle or affine_compression or altered_congruence or point_renaming or segment' --junitxml=reports/source-bridge-tests.xml | tee reports/source-bridge-tests.log
      - name: Frozen normal-entry geometry comparison
        if: ${{ !contains(env.EXPERIMENT_CONFIG, 'theory-geometry-autonomous-solve') && !contains(env.EXPERIMENT_CONFIG, 'relational-dsl') && !contains(env.EXPERIMENT_CONFIG, 'algebraic-structures') }}
        run: python scripts/run_theory_formation.py --config "$EXPERIMENT_CONFIG" --output reports/semantic-feedback-normal
      - name: Preregistered relational DSL comparison
        if: contains(env.EXPERIMENT_CONFIG, 'relational-dsl')
        timeout-minutes: 285
        run: python scripts/run_relational_geometry_eval.py --config "$EXPERIMENT_CONFIG" --output reports/semantic-feedback-normal
      - name: Preregistered algebraic structure reductions
        if: contains(env.EXPERIMENT_CONFIG, 'algebraic-structures')
        timeout-minutes: 120
        run: python scripts/run_algebraic_structures_eval.py --config "$EXPERIMENT_CONFIG" --output reports/semantic-feedback-normal
      - name: Frozen autonomous symbolic solver cohort
        if: contains(env.EXPERIMENT_CONFIG, 'theory-geometry-autonomous-solve')
        run: python scripts/verify_theory_geometry.py --plan "$EXPERIMENT_CONFIG" --output reports/semantic-feedback-normal
      - name: Independently replay symbolic DSL histories and acquired contracts
        if: contains(env.EXPERIMENT_CONFIG, 'theory-geometry-symbolic-dsl')
        run: python scripts/verify_geometry_symbolic_dsl.py --run reports/semantic-feedback-normal
      - name: Verify diagnostic analysis on synthetic inputs
        if: env.EXPERIMENT_CONFIG == 'configs/theory-geometry-failure-location.json'
        run: python -m pytest -q tests/test_geometry_failure_diagnostic.py --junitxml=reports/failure-diagnostic-tests.xml
      - name: Diagnose fresh trace without feeding witnesses to search
        if: env.EXPERIMENT_CONFIG == 'configs/theory-geometry-failure-location.json'
        run: python scripts/diagnose_geometry_failure_location.py --run reports/semantic-feedback-normal --witnesses configs/geometry-failure-witnesses.json --output reports/failure-location-analysis
      - name: Verify vendored bytes and actual installation origin after execution
        if: always()
        run: python scripts/verify_vendored_newclid.py --output reports/newclid-after.json
      - name: Preserve fresh evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-geometry-${{ github.sha }}-${{ github.run_id }}
          path: |
            reports/newclid-*.json
            reports/newclid-upstream-tests.*
            reports/semantic-feedback-tests.*
            reports/source-bridge-tests.*
            reports/semantic-feedback-normal/
            reports/failure-diagnostic-tests.xml
            reports/failure-location-analysis/
  exact-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install symbolic test dependencies
        run: pip install -r worker/requirements.txt pytest pandas pyarrow
      - name: Verify exact proposal, search, and proof gates
        run: >-
          python -B -m pytest -q
          worker/backend/test_numerical_incidence_auxiliary.py
          worker/backend/test_typed_bidirectional_priority.py
          worker/backend/test_constructible_groebner.py
          worker/backend/test_wu_zero_decomposition.py
          worker/backend/test_typed_candidate_alignment.py
          worker/backend/test_typed_open_proof_dag.py
          tests/test_export_hageo409_jgex.py
          tests/test_finalize_geometry_proof_portfolio.py

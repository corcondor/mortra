name: Mario continuation frontier CI

on:
  push:
    branches:
      - research/mario-continuation-frontier-20260930
  workflow_dispatch:

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q numpy scipy Pillow pytest
      - name: Run continuation-frontier tests
        run: |
          python -m pytest -q             tests/test_mario_continuation_frontier.py             tests/test_mario_continual.py             tests/test_virtual_frontier.py             tests/test_continual_tools.py

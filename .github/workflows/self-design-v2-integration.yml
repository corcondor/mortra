name: Self Game Design V2 exploration integration
on:
  push:
    branches: [research/self-design-v2-virtual-frontier-20260927]
    paths:
      - experiments/self_design_v2_integration/**
      - tests/test_self_design_v2_integration.py
      - .github/workflows/self-design-v2-integration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-design-v2-integration-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  MPLBACKEND: Agg
jobs:
  original-reproduction:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            experiments
            scripts
            tests
            docs
            .github
            reports/self_game_design_v2
      - run: git fetch origin 156abc04d3ae77f1ac42d151f5d60830585f6ae7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt
      - run: python -m pytest tests/test_self_game_design_v2.py -q --junitxml=v2-tests.xml
      - run: python scripts/evaluate_autonomous_game_design_loop.py --output reports/v2_original_reproduction_${{ github.run_id }}
      - run: python -m experiments.self_design_v2_integration.verify --actual reports/v2_original_reproduction_${{ github.run_id }} --output reports/v2_reproduction_gate_${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v2-reproduction-${{ github.run_id }}
          path: |
            v2-tests.xml
            reports/v2_original_reproduction_*/
            reports/v2_reproduction_gate_*/
          retention-days: 90
  adapter-tests:
    needs: original-reproduction
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            experiments
            scripts
            tests
            docs
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt scipy==1.17.0 psutil==7.0.0
      - run: python -m pytest tests/test_self_game_design_v2.py tests/test_self_design_v2_integration.py -q --junitxml=integration-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adapter-tests-${{ github.run_id }}
          path: integration-tests.xml
          retention-days: 90
  smoke:
    needs: adapter-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        method: [structural, frontier_t0, virtual_frontier]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            experiments
            scripts
            tests
            docs
            .github
      - run: git fetch origin 156abc04d3ae77f1ac42d151f5d60830585f6ae7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt scipy==1.17.0 psutil==7.0.0
      - run: python -m experiments.self_design_v2_integration.run --stage smoke --seed 79020000 --method ${{ matrix.method }} --output reports/v2_smoke_${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smoke-${{ matrix.method }}-${{ github.run_id }}
          path: reports/v2_smoke_*/
          retention-days: 90
  smoke-gate:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt scipy==1.17.0 psutil==7.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-smoke-*
          path: smoke-results
      - run: python -m experiments.self_design_v2_integration.summarize --stage smoke --input smoke-results --output reports/v2_smoke_gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-smoke-gate-${{ github.run_id }}
          path: reports/v2_smoke_gate/
          retention-days: 90
  full:
    needs: smoke-gate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [79020000, 79020001, 79020002, 79020003, 79020004, 79020005, 79020006, 79020007]
        method: [structural, frontier_t0, virtual_frontier]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            experiments
            scripts
            tests
            docs
            .github
      - run: git fetch origin 156abc04d3ae77f1ac42d151f5d60830585f6ae7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt scipy==1.17.0 psutil==7.0.0
      - run: python -m experiments.self_design_v2_integration.run --stage full --seed ${{ matrix.seed }} --method ${{ matrix.method }} --output reports/v2_full_${{ matrix.seed }}_${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-full-${{ matrix.seed }}-${{ matrix.method }}-${{ github.run_id }}
          path: reports/v2_full_*/
          retention-days: 90
  summary:
    needs: full
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt scipy==1.17.0 psutil==7.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-full-*
          path: full-results
      - uses: actions/download-artifact@v4
        with:
          pattern: v2-smoke-*
          path: smoke-results
      - run: python -m experiments.self_design_v2_integration.summarize --stage full --input full-results --smoke-input smoke-results --output reports/v2_integration_summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-integration-summary-${{ github.run_id }}
          path: reports/v2_integration_summary/
          retention-days: 90

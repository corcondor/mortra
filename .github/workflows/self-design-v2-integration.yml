name: Self Game Design V2 exploration integration
on:
  push:
    branches: [research/self-design-v2-virtual-frontier-20260927]
    paths:
      - experiments/self_design_v2_integration/**
      - tests/test_self_design_v2_integration.py
      - .github/workflows/self-design-v2-integration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-design-v2-integration-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  MPLBACKEND: Agg
jobs:
  original-reproduction:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            experiments
            scripts
            tests
            docs
            .github
            reports/self_game_design_v2
      - run: git fetch origin 156abc04d3ae77f1ac42d151f5d60830585f6ae7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt
      - run: python -m pytest tests/test_self_game_design_v2.py -q --junitxml=v2-tests.xml
      - run: python scripts/evaluate_autonomous_game_design_loop.py --output reports/v2_original_reproduction_${{ github.run_id }}
      - run: python -m experiments.self_design_v2_integration.verify --actual reports/v2_original_reproduction_${{ github.run_id }} --output reports/v2_reproduction_gate_${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-v2-reproduction-${{ github.run_id }}
          path: |
            v2-tests.xml
            reports/v2_original_reproduction_*/
            reports/v2_reproduction_gate_*/
          retention-days: 90

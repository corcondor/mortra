name: Frontier v1.3 Offline Structural Edit Prediction
on:
  push:
    branches: [research/frontier-v13-structural-edit-prediction-20260925]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frontier-v13-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  MPLBACKEND: Agg
  GH_TOKEN: ${{ github.token }}
jobs:
  stage0:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 scipy==1.16.1 scikit-learn==1.7.2 pandas==2.2.3 matplotlib==3.10.5 psutil==7.0.0 pytest==8.4.1
      - run: python -m pytest tests/test_autonomous_game_frontier_v1.py tests/test_autonomous_game_frontier_v11.py tests/test_autonomous_game_frontier_v11_holdout.py tests/test_autonomous_game_frontier_v11_generation_holdout.py tests/test_autonomous_game_frontier_v11_replication.py tests/test_autonomous_game_frontier_v12.py tests/test_frontier_v12_theory.py tests/test_frontier_v13.py -q --junitxml=correctness.xml
      - run: python scripts/evaluate_frontier_v13_structural_edit_prediction.py dataset --output dataset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-dataset
          path: dataset/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-tests
          path: correctness.xml
          retention-days: 90
  stage1:
    needs: stage0
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 scipy==1.16.1 scikit-learn==1.7.2
      - uses: actions/download-artifact@v4
        with:
          name: v13-dataset
          path: dataset
      - run: python scripts/evaluate_frontier_v13_structural_edit_prediction.py fold --source dataset --seed 2101 --output smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-smoke
          path: smoke/
          retention-days: 90
  stage2:
    needs: stage1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [2101,2202,2303,2404,2505,2606,2707,2808]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 scipy==1.16.1 scikit-learn==1.7.2
      - uses: actions/download-artifact@v4
        with:
          name: v13-dataset
          path: dataset
      - run: python scripts/evaluate_frontier_v13_structural_edit_prediction.py fold --source dataset --seed ${{ matrix.seed }} --output fold
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-fold-${{ matrix.seed }}
          path: fold/
          retention-days: 90
  summary:
    needs: stage2
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 scipy==1.16.1 scikit-learn==1.7.2 pandas==2.2.3 matplotlib==3.10.5
      - uses: actions/download-artifact@v4
        with:
          name: v13-dataset
          path: dataset
      - uses: actions/download-artifact@v4
        with:
          name: v13-smoke
          path: smoke
      - uses: actions/download-artifact@v4
        with:
          pattern: v13-fold-*
          path: folds
      - name: Normalize fold directory names
        run: |
          python -c "from pathlib import Path; [p.rename(p.with_name(p.name.removeprefix('v13-fold-'))) for p in Path('folds').iterdir()]"
      - run: python scripts/evaluate_frontier_v13_structural_edit_prediction.py verify-smoke --source smoke --folds folds --output smoke_equality.json
      - run: python scripts/evaluate_frontier_v13_structural_edit_prediction.py replay --source dataset --folds folds --output replay
      - run: python scripts/evaluate_frontier_v13_structural_edit_prediction.py report --source dataset --folds folds --replay replay --output reports/frontier_v13_structural_edit_prediction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-final
          path: |
            reports/frontier_v13_structural_edit_prediction/
            smoke_equality.json
          retention-days: 90

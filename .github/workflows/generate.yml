name: Run MORTRA Discovery Job

on:
  repository_dispatch:
    types: [generate-problem]

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install symbolic backends
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Reject removed external backends
        run: python scripts/external_backend_invariant.py

      - name: Verify structural discovery
        working-directory: worker
        run: npm test && npm run build

      - name: Process structural discovery job
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: npx tsx src/process-job.ts

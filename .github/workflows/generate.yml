name: Generate Math Problem

on:
  repository_dispatch:
    types: [generate-problem]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install exact symbolic backend
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Install dependencies
        working-directory: worker
        run: npm install

      - name: Verify structural discovery
        working-directory: worker
        run: npm test && npm run build

      - name: Process job
        working-directory: worker
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID:                    ${{ github.event.client_payload.job_id }}
        run: npx tsx src/process-job.ts

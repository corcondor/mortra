      - "worker/backend/differentiable_proof_controller.py"
      - "worker/backend/test_differentiable_proof_controller.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Check out pinned Newclid source
        run: |
          git clone --filter=blob:none https://github.com/Newclid/Newclid.git "$RUNNER_TEMP/Newclid"
          git -C "$RUNNER_TEMP/Newclid" checkout ac6550732a950564cf7614d605b5bf1eadd29701
          echo "NEWCLID_ROOT=$RUNNER_TEMP/Newclid" >> "$GITHUB_ENV"
      - name: Install verification dependencies
        run: |
          python -m pip install pytest==8.4.1 sympy==1.14.0
          python -m pip install -e "$NEWCLID_ROOT/newclid"
      - name: Compile research modules
        run: |
          python -m py_compile \
            scripts/experiment_gclc_newclid_certificate_bridge.py \
            scripts/experiment_jgex_exact_portfolio.py \
            scripts/experiment_jgex_exact_unsolved_set.py \
            scripts/experiment_local_polynomial_stalk_fixed4.py \
            scripts/experiment_chordal_buchberger_fixed4.py \
            scripts/experiment_hybrid_polynomial_stalk_fixed4.py \
            scripts/experiment_singular_lift_fixed4.py \
            scripts/experiment_certified_wu_fixed4.py \
            scripts/experiment_newclid_construction_stalk.py \
            scripts/experiment_differentiable_proof_controller.py \
            scripts/experiment_candidate_gate_ablation.py \
            scripts/verify_candidate_gate_ablation.py \
            scripts/experiment_open_goal_feedback_imo_ag_30.py \
            scripts/compare_open_goal_feedback_ablation.py \
            scripts/verify_open_goal_independent_exchange.py \
            scripts/verify_newclid_construction_stalk_artifact.py \
            scripts/verify_certified_wu_artifact.py \
            scripts/experiment_wu_ritt_characteristic_decomposition.py \
            scripts/experiment_wu_ritt_parameter_field.py \
            scripts/audit_wu_rtm_support_artifact.py \
            scripts/verify_wu_ritt_artifacts.py \
            scripts/verify_chordal_lift_artifacts.py \
            scripts/merge_jgex_exact_portfolio.py \
            scripts/reproduce_gclc_methods.py \
            scripts/reproduce_yuclid_imo_ag_30.py \
            scripts/verify_jgex_exact_reproduction.py \
            scripts/verify_local_polynomial_stalk_artifacts.py \
            scripts/verify_mortra_research_manifest.py \
            worker/backend/gclc_newclid_bridge.py \
            worker/backend/geometry_relation_channels.py \
            worker/backend/geometry_local_lemma_certificate.py \
            worker/backend/jgex_exact_constraint_bridge.py \
            worker/backend/jgex_local_relation_stalk.py \
            worker/backend/jgex_legacy_normalizer.py \
            worker/backend/local_polynomial_elimination.py \
            worker/backend/polynomial_stalk_adapter.py \
            worker/backend/certified_buchberger.py \
            worker/backend/chordal_buchberger_elimination.py \
            worker/backend/chordal_polynomial_stalk.py \
            worker/backend/singular_lift_backend.py \
            worker/backend/certified_wu_characteristic.py \
            worker/backend/wu_polynomial_stalk.py \
            worker/backend/wu_ritt_characteristic.py \
            worker/backend/wu_ritt_zero_decomposition.py \
            worker/backend/wu_rtm_support.py \
            worker/backend/wu_experiment_selection.py \
            worker/backend/typed_geometry_stalk.py \
            worker/backend/geometry_proof_hypergraph.py \
            worker/backend/geometry_ar_residual.py \
            worker/backend/differentiable_proof_controller.py
      - name: Run symbolic bridge tests
        run: |
          python -m pytest \
            worker/backend/test_gclc_newclid_bridge.py \
            worker/backend/test_geometry_relation_channels.py \
            worker/backend/test_geometry_local_lemma_certificate.py \
            worker/backend/test_jgex_legacy_normalizer.py \
            worker/backend/test_jgex_exact_constraint_bridge.py \
            worker/backend/test_jgex_local_relation_stalk.py \
            worker/backend/test_local_polynomial_elimination.py \
            worker/backend/test_polynomial_stalk_adapter.py \
            worker/backend/test_certified_buchberger.py \
            worker/backend/test_chordal_buchberger_elimination.py \
            worker/backend/test_chordal_polynomial_stalk.py \
            worker/backend/test_singular_lift_backend.py \
            worker/backend/test_certified_wu_characteristic.py \
            worker/backend/test_wu_polynomial_stalk.py \
            worker/backend/test_wu_ritt_characteristic.py \
            worker/backend/test_wu_ritt_zero_decomposition.py \
            worker/backend/test_wu_rtm_support.py \
            worker/backend/test_wu_experiment_selection.py \
            worker/backend/test_typed_geometry_stalk.py \
            worker/backend/test_geometry_proof_hypergraph.py \
            worker/backend/test_geometry_ar_residual.py \
            worker/backend/test_differentiable_proof_controller.py \
            worker/backend/test_open_goal_feedback_portfolio.py \
            worker/backend/test_open_goal_feedback_ablation.py \
            -q
      - name: Verify published artifacts and acceptance claims
        run: |
          python scripts/verify_mortra_research_manifest.py \
            --manifest data/mortra-reversible-synthesis-reproduction-manifest-2026-08-16.json
          python scripts/verify_local_polynomial_stalk_artifacts.py \
            --manifest data/local-polynomial-stalk-reproduction-manifest-2026-08-16.json
          python scripts/verify_chordal_lift_artifacts.py \
            --manifest data/chordal-lift-reproduction-manifest-2026-08-16.json
          python scripts/verify_certified_wu_artifact.py \
            --artifact data/certified-wu-relational-construction-fixed4-micro-2026-08-16.json
          python scripts/verify_newclid_construction_stalk_artifact.py \
            --artifact data/newclid-proof-hypergraph-balanced-aux-search-2010-p2-2026-08-16.json
          python scripts/verify_newclid_construction_stalk_artifact.py \
            --artifact data/differentiable-trust-only-live-2020-p1-2026-08-18.json.gz
          python scripts/verify_newclid_construction_stalk_artifact.py \
            --artifact data/differentiable-trust-only-portfolio-live-2020-p1-2026-08-18.json.gz
          python scripts/verify_candidate_gate_ablation.py \
            --artifact data/candidate-gate-depth1-ablation-2026-08-18.json
          python scripts/verify_wu_ritt_artifacts.py \
            --standard-artifact data/wu-ritt-standard-strict180-2021-p3-2026-08-17.json.gz \
            --proof-artifact data/wu-ritt-weak-strict180-2021-p3-2026-08-17.json.gz \
            --parameter-field-artifact data/wu-ritt-parameter-field-2021-p3-2026-08-17.json \
            --goal-cone-artifact data/wu-ritt-goal-cone-2021-p3-2026-08-17.json.gz \
            --decomposition-artifact data/wu-ritt-weak-zero-decomposition-2021-p3-one-child-2026-08-17.json \
            --problem 2021_p3

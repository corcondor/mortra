name: V2 same-game online feedback development
on:
  push:
    branches: [research/self-design-v2-online-feedback-20260927]
    paths:
      - experiments/v2_online_feedback/**
      - tests/test_v2_online_feedback.py
      - .github/workflows/v2-online-feedback.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v2-online-feedback-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  MPLBACKEND: Agg
jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            experiments
            scripts
            tests
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt scipy==1.17.0 psutil==7.0.0
      - run: python -m pytest tests/test_self_game_design_v2.py tests/test_self_design_v2_integration.py tests/test_v2_online_feedback.py -q --junitxml=feedback-tests.xml
      - run: python -m experiments.v2_online_feedback.prepare --output reports/registered_inputs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python -m experiments.v2_online_feedback.gate --input reports/registered_inputs --output reports/reproduction_gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-gates-${{ github.run_id }}
          path: |
            feedback-tests.xml
            reports/registered_inputs/
            reports/reproduction_gate/
          retention-days: 90
  compare:
    needs: gates
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [79020000, 79020001, 79020002, 79020003, 79020004, 79020005, 79020006, 79020007]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            experiments
            scripts
            tests
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt scipy==1.17.0 psutil==7.0.0
      - uses: actions/download-artifact@v4
        with:
          name: feedback-gates-${{ github.run_id }}
          path: gated
      - run: python -m experiments.v2_online_feedback.run --seed ${{ matrix.seed }} --input gated/reports/registered_inputs --gate gated/reports/reproduction_gate --output reports/feedback_${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-${{ matrix.seed }}-${{ github.run_id }}
          path: reports/feedback_*/
          retention-days: 90
  summary:
    needs: compare
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-game-tests.txt scipy==1.17.0 psutil==7.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: feedback-7902*
          path: results
      - run: python -m experiments.v2_online_feedback.summarize --input results --output reports/feedback_summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-summary-${{ github.run_id }}
          path: reports/feedback_summary/
          retention-days: 90

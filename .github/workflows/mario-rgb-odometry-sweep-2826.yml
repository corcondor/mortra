name: Mario exhaustive RGB odometry sweep

on:
  push:
    branches:
      - research/mario-revisit-causal-20260930
    paths:
      - experiments/mario_continual/rgb_odometry_sweep_2826.py
      - .github/workflows/mario-rgb-odometry-sweep-2826.yml
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          python -m pip install -q numpy scipy Pillow psutil
      - name: Build pinned Mario engine
        run: python -m experiments.mario_continual.setup_game
      - name: Run exhaustive RGB-only sweep
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            python -u -m experiments.mario_continual.rgb_odometry_sweep_2826
      - name: Show result
        if: always()
        run: cat /tmp/rgb_odometry_sweep_2826.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mario-rgb-odometry-sweep-2826
          path: /tmp/rgb_odometry_sweep_2826.json

name: Noisy RGB version-space frozen comparison
on:
  push:
    branches: [research/noisy-rgb-version-space-20260927]
    paths:
      - experiments/noisy_rgb_version_space/**
      - tests/test_noisy_rgb_version_space.py
      - .github/workflows/noisy-rgb-version-space.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noisy-rgb-version-space-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
jobs:
  tests:
    runs-on: windows-latest
    outputs:
      seeds: ${{ steps.manifest.outputs.seeds }}
      phase: ${{ steps.manifest.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/noisy_rgb_discovery
            experiments/noisy_rgb_version_space
            scripts
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0 pytest==8.4.1 psutil==7.0.0
      - run: python -m pytest tests/test_noisy_rgb_discovery.py tests/test_noisy_rgb_version_space.py -q --junitxml=tests.xml
      - id: manifest
        shell: pwsh
        run: |
          $path = 'experiments/noisy_rgb_version_space/fresh_manifest.json'
          if (Test-Path $path) {
            $m = Get-Content $path -Raw | ConvertFrom-Json
            if (-not $m.development_gate_passed) { throw 'Development gate not passed' }
            "seeds=$($m.seeds | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
            'phase=fresh' >> $env:GITHUB_OUTPUT
          } else {
            'seeds=[95027004,95027005]' >> $env:GITHUB_OUTPUT
            'phase=development' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs-tests-${{ github.run_id }}
          path: tests.xml
          retention-days: 90
  experiment:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: ${{ fromJSON(needs.tests.outputs.seeds) }}
        camera: [base, shifted]
        arm: [H, V]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/noisy_rgb_discovery
            experiments/noisy_rgb_version_space
            scripts
            reports/noisy_rgb_discovery_36293621710
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0 psutil==7.0.0
      - run: python -m experiments.noisy_rgb_version_space.run --phase ${{ needs.tests.outputs.phase }} --seed ${{ matrix.seed }} --camera ${{ matrix.camera }} --arm ${{ matrix.arm }} --output run_data/${{ matrix.seed }}_${{ matrix.camera }}_${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs-${{ matrix.seed }}-${{ matrix.camera }}-${{ matrix.arm }}-${{ github.run_id }}
          path: run_data/
          compression-level: 0
          retention-days: 90
  aggregate:
    needs: [tests, experiment]
    if: always() && needs.tests.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/noisy_rgb_discovery
            experiments/noisy_rgb_version_space
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==1.26.4 Pillow==11.3.0 psutil==7.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: vs-9*
          path: downloaded
      - run: python -m experiments.noisy_rgb_version_space.aggregate --input downloaded --output summary --phase ${{ needs.tests.outputs.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs-summary-${{ github.run_id }}
          path: summary/
          retention-days: 90
